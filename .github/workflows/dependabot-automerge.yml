name: Dependabot auto-merge

# Active la fusion automatique (squash) des PR Dependabot qui ne sont pas une
# majeure. GitHub ne fusionne qu'une fois tous les checks requis de la
# protection de main au vert — ce workflow ne fusionne jamais une PR rouge.
# Les majeures (ignorées en routine dans dependabot.yml ; un correctif de
# sécurité peut en être une) restent ouvertes pour un humain.
#
# La fusion se fait avec DEPENDABOT_AUTOMERGE_TOKEN (PAT à grain fin, rangé en
# secret *Dependabot*) : une fusion faite avec GITHUB_TOKEN ne déclenche pas les
# workflows de push, donc ni la CI ni le déploiement ne tourneraient sur main.
# Sans le secret, le job échoue bruyamment au lieu de ne rien faire.
# Doc de la flotte : OPERATIONS.md §3.20.

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # fetch-metadata misreads Dependabot range bumps such as
      # "update psycopg requirement from <4,>=3.3.6 to >=3.3.9,<4": it takes
      # "4,>=3.3.6" as the old version and reports 4 -> 3.3.9 as a major, so
      # these patch/minor PRs never got auto-merge. For a reported major, keep
      # it major unless the >= lower bound's major and the < upper bound are
      # both unchanged.
      - name: Classify update
        id: kind
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          major=false
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            major=true
            from=$(printf '%s' "$TITLE" | sed -nE 's/.* requirement from (.+) to (.+)$/\1/p')
            to=$(printf '%s' "$TITLE" | sed -nE 's/.* requirement from (.+) to (.+)$/\2/p')
            lo() { printf '%s' "$1" | grep -oE '>=[0-9]+' | head -1; }
            hi() { printf '%s' "$1" | grep -oE '<[0-9][0-9.]*' | head -1; }
            if [ -n "$(lo "$from")" ] && [ "$(lo "$from")" = "$(lo "$to")" ] && [ "$(hi "$from")" = "$(hi "$to")" ]; then
              major=false
            fi
          fi
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Fusion automatique (hors majeures)
        if: steps.kind.outputs.major != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN (secret Dependabot) absent — fusion automatique non activée."
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
