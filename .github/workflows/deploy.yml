name: Deploy

# Modèle de la flotte (OPERATIONS.md §3.11), repris de QuizOnline : après une CI
# verte sur main, OIDC → rôle IAM chronos-deploy → SSM sur l'instance.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-chronos
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Déploiement sur l'instance par SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Commandes SSM, exécutées par ROOT, dans l'ordre. SSM les enchaîne en UN
          # script et ne retient que le code de la dernière : sans `set -eu`, une
          # étape ratée (ssm-deploy.sh sans .env, donc sans migrate) passait pour
          # un succès dès que le chown final réussissait. `sh` (dash) : pas de pipefail.
          #   0. set -eu : la première commande en échec arrête tout → Failed ;
          #   1. chown de l'arborescence (répare des objets git laissés root) ;
          #   2. en django, umask 027 : fetch + reset --hard sur origin/main ;
          #   3. en root : unités systemd, script de configuration et nginx
          #      installés depuis le BLOB GIT VALIDÉ, jamais depuis l'arbre
          #      modifiable par django (§3.10) ; nginx -t, sinon retour arrière ;
          #   4. en django : ssm-deploy.sh (pip, migrate, collectstatic, restart) ;
          #   5. normalisation finale des droits : 750 / 640, groupe www-data.
          A=/var/www/django_websites/Chronos
          G="git -C $A -c safe.directory=$A show origin/main"
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -eu",
              "chown -R django:www-data $A",
              "sudo -u django bash -c 'umask 027; cd $A && git fetch --quiet && git reset --hard --quiet origin/main'",
              "$G:deploy/chronos-env-fetch.service > /etc/systemd/system/chronos-env-fetch.service",
              "$G:deploy/chronos-gunicorn.service > /etc/systemd/system/chronos-gunicorn.service",
              "$G:deploy/chronos-courriels.service > /etc/systemd/system/chronos-courriels.service",
              "$G:deploy/chronos-courriels.timer > /etc/systemd/system/chronos-courriels.timer",
              "$G:deploy/fetch-env-from-ssm.sh > /usr/local/sbin/chronos-env-fetch.sh && chmod 0755 /usr/local/sbin/chronos-env-fetch.sh && chown root:root /usr/local/sbin/chronos-env-fetch.sh",
              "systemctl daemon-reload",
              "bash -c 'set -e; $G:deploy/nginx/chronos.foxugly.com.conf > /etc/nginx/sites-available/chronos.foxugly.com.new; cp -a /etc/nginx/sites-available/chronos.foxugly.com /etc/nginx/sites-available/chronos.foxugly.com.deploybak; mv /etc/nginx/sites-available/chronos.foxugly.com.new /etc/nginx/sites-available/chronos.foxugly.com; nginx -t || { mv /etc/nginx/sites-available/chronos.foxugly.com.deploybak /etc/nginx/sites-available/chronos.foxugly.com; exit 1; }; systemctl reload nginx'",
              "sudo -u django bash $A/deploy/ssm-deploy.sh",
              "chown -R django:www-data $A && chmod -R g-w,o-rwx $A"
            ],
            "executionTimeout": ["900"]
          }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy chronos $SHA" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Attente de la fin du déploiement
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Déploiement : $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Délai dépassé (15 min)"; exit 1

      - name: Vérification de /health/
        run: |
          for tentative in $(seq 1 10); do
            code=$(curl -sS -o /tmp/sante.json -w '%{http_code}' --max-time 10 https://chronos.foxugly.com/health/ || echo 000)
            echo "Tentative $tentative : HTTP $code"
            [ "$code" = "200" ] && { cat /tmp/sante.json; exit 0; }
            sleep 6
          done
          echo "::error::/health/ ne répond pas 200 après le déploiement"; exit 1
