# chronos.foxugly.com — installé par le déploiement depuis le blob git validé
# (/etc/nginx/sites-available/chronos.foxugly.com), vérifié par `nginx -t`
# avant rechargement. Modifier ce fichier dans le dépôt, jamais sur la machine.
#
# Différence avec le reste de la flotte : **aucune pièce n'est servie en
# public**. /media/ n'existe pas ; Django vérifie les droits puis répond par
# X-Accel-Redirect vers /_pieces_internes/, `internal` : joignable seulement
# par cette redirection, jamais par une URL tapée.

# Journal d'accès sans secret (audit du 2026-10-18, I2) : le chemin sans query
# string (`q=` est une recherche dans un dossier de litige), le jeton de
# partage, d'invitation, de confirmation ou de réinitialisation remplacé par
# `[token]`, et pas de Referer (il porte les mêmes jetons). `$request_uri`
# plutôt que `$uri` : après un X-Accel-Redirect, `$uri` vaudrait le chemin du
# fichier sur le disque. Noms préfixés `chronos_` : `map` et `log_format` sont
# globaux à nginx. Rejoué par events/tests/test_journaux.py.
map $request_uri $chronos_chemin_brut {
    "~^(?<chronos_chemin>[^?]*)" $chronos_chemin;
}

map $chronos_chemin_brut $chronos_chemin_journal {
    "~^(?<chronos_avant>.*?/(?:partage|invitation|confirm-email|password/reset/key)/)(?!done/)[^/]+(?<chronos_apres>.*)$" "${chronos_avant}[token]${chronos_apres}";
    default $chronos_chemin_brut;
}

# Les pièces servies par X-Accel-Redirect (audit du 2026-10-18, M5) : une CSP
# `sandbox` — origine opaque, aucun script — sur tout ce qui s'ouvre dans un
# onglet. Sauf les PDF : Chrome et Firefox refusent d'afficher un PDF dans un
# document `sandbox` (l'aperçu des pièces deviendrait blanc), et leur lecteur
# fait déjà tourner le script d'un PDF à l'écart de l'origine. Valeur vide →
# nginx n'ajoute pas l'en-tête. `$uri` est ici le chemin interne
# (/_pieces_internes/…), donc l'extension du fichier stocké.
map $uri $chronos_csp_piece {
    "~*\.pdf$" "";
    default "sandbox";
}

log_format chronos_sans_jeton '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $chronos_chemin_journal $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name chronos.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chronos.foxugly.com;

    ssl_certificate /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/chronos.access.log chronos_sans_jeton;
    error_log /var/log/nginx/chronos.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Ce que Django sert, Django en pose les en-têtes de sécurité (CSP avec
    # nonce, X-Frame-Options, HSTS, nosniff, Referrer-Policy) : il connaît la
    # page — un lien de partage exige `no-referrer`. Les poser ici aussi les
    # doublait, et pour Referrer-Policy le navigateur retenait celui de nginx.
    # Ici, seulement ce que Django n'envoie jamais ; les locations que nginx
    # sert seul (statiques, pièces) posent les leurs.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Plusieurs pièces par envoi ; Django refuse ensuite toute pièce de plus
    # de 50 Mo (DOCUMENT_TAILLE_MAX). Ici, la borne qui protège la machine.
    client_max_body_size 100M;

    location ^~ /static/ {
        alias /var/www/django_websites/Chronos/staticfiles/;
        expires 7d;
        access_log off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Jamais de pièce en accès direct.
    location ^~ /media/ {
        return 404;
    }

    # Les pièces, après contrôle des droits par Django (X-Accel-Redirect).
    # nginx choisit le type d'après l'extension : seuls PDF, JPEG et PNG
    # gardent le leur (aperçu et visionneuse) ; tout le reste part en
    # application/octet-stream, donc en téléchargement, jamais affiché.
    # Les en-têtes de sécurité sont répétés : add_header ne s'hérite pas dans
    # un location qui en pose (OPERATIONS.md §3.19).
    location ^~ /_pieces_internes/ {
        internal;
        alias /var/www/django_websites/Chronos/media/;
        types {
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/png png;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy $chronos_csp_piece always;
    }

    location = /health/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Changer un alias Exchange : deux connexions PowerShell à la suite.
        proxy_read_timeout 130s;
    }
}
