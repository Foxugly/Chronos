{% load i18n %}
{# Un côté d'une paire de doublons possibles, avec son bouton « garder celui-ci ». #}
<div class="col-12 col-md-6">
    <label class="d-block h-100 border rounded p-3 bg-body"
           {% if evenement.couleur_affichee %}style="border-left: 6px solid {{ evenement.couleur_affichee }} !important;"{% endif %}>
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="garder" value="{{ evenement.pk }}"
                   {% if evenement.pk == garder.pk %}checked{% endif %} required>
            <span class="form-check-label fw-semibold">{% translate "Garder celui-ci" %}</span>
        </div>
        <span class="badge text-bg-secondary">{{ evenement.periode_affichee }}</span>
        <div class="fw-semibold mt-1 text-break">
            <a class="text-decoration-none" href="{% url 'event_detail' evenement.pk %}" target="_blank" rel="noopener">{{ evenement.title }}</a>
        </div>
        {% if evenement.expediteur %}
            <div class="small text-body-secondary">
                <i class="bi bi-envelope me-1" aria-hidden="true"></i>{% blocktranslate trimmed with nom=evenement.expediteur %}Importé par courriel — de {{ nom }}{% endblocktranslate %}
            </div>
        {% else %}
            <div class="small text-body-secondary"><i class="bi bi-pencil me-1" aria-hidden="true"></i>{% translate "Saisi à la main" %}</div>
        {% endif %}
        {% if evenement.resume %}
            <p class="small mt-2 mb-2 text-break">{{ evenement.resume }}</p>
        {% endif %}
        <div class="small text-body-secondary">
            <i class="bi bi-paperclip me-1" aria-hidden="true"></i>{% blocktranslate trimmed count n=evenement.pieces_affichees|length %}{{ n }} pièce{% plural %}{{ n }} pièces{% endblocktranslate %}
        </div>
    </label>
</div>
